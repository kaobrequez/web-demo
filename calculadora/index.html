<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simple</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cascadia+Code:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="calculadora">
        <h2>Calculadora</h2>

        <label>Número 1:</label>
        <input type="number" id="num1" placeholder="ingrese un número">

        <label>Elija una Operación:</label>
        <select id="operacion">
            <option value="+">Sumar (+)</option>
            <option value="-">Restar (-)</option>
            <option value="*">Multiplicar (×)</option>
            <option value="/">Dividir (÷)</option>
        </select>

        <label>Número 2:</label>
        <input type="number" id="num2" placeholder="ingrese un número">

        <button onclick="calcular()">Aceptar</button>

        <div class="resultado" id="resultado">Resultado: -</div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
